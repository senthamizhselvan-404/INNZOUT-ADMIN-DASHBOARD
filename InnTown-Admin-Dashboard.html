:root{--green:#1D6B45;--green-d:#14502F;--turmeric:#F2B21B;--cream:#FBF7EF;--ink:#1C2420;--leaf:#E3F2E8;--muted:#55625A;--line:#E3DCC8;--red:#C2352B;--red-bg:#FBE3E0;--amber-bg:#FCEFC8;--blue-bg:#DCEBF7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Hind Madurai',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,.bh{font-family:'Baloo Thambi 2','Hind Madurai',sans-serif;font-weight:700;margin:0;line-height:1.15}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
[hidden]{display:none!important}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.col{display:flex;flex-direction:column}.wrap{flex-wrap:wrap}.gap6{gap:6px}.gap16{gap:16px}.grow{flex:1;min-width:0}
/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--green);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:40;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .logo b{font-family:'Baloo Thambi 2';font-size:22px}.side .logo b span{color:var(--turmeric)}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:rgba(255,255,255,.88);padding:0 12px;min-height:46px;border-radius:12px;font-weight:600;font-size:15px;text-align:left}
.nv:hover{background:rgba(255,255,255,.1)}
.nv.on{background:#fff;color:var(--green)}
.nv .bd{margin-left:auto;background:var(--turmeric);color:var(--ink);border-radius:11px;min-width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.side .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.7);padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.top .hn{font-family:'Baloo Thambi 2';font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .grow>.xs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib.ham{display:none}
.content{padding:22px 24px 60px;max-width:1500px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:28px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--green);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--green-d)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.o{background:#fff;color:var(--green);border:1.5px solid var(--green)}.btn.o:hover{background:var(--leaf)}
.btn.d{background:#fff;color:#9B2C23;border:1.5px solid #E6B3AD}.btn.d:hover{background:var(--red-bg)}
.btn.red{background:var(--red)}.btn.y{background:var(--turmeric);color:var(--ink)}.btn.g{background:transparent;color:var(--green)}.btn.g:hover{background:var(--leaf)}
.btn.s{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative}
.ib:hover{background:var(--leaf)}
.ib .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.fld{width:100%;min-height:44px;border-radius:10px;background:#fff;border:1.5px solid var(--line);padding:0 12px;outline:0}
textarea.fld{padding:10px 12px;min-height:80px;resize:vertical}
.fld:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,107,69,.15)}
.fl{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.sw{width:46px;height:28px;border-radius:14px;background:#C9CDC7;position:relative;border:0;padding:0;flex:none;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on i{left:21px}
.vm{display:inline-flex;width:15px;height:15px;border:2px solid;border-radius:3px;align-items:center;justify-content:center;flex:none}.vm i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.tabs{display:flex;background:#F1ECDF;border-radius:12px;padding:3px;gap:2px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:0 16px;min-height:38px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--green)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat .v{font-family:'Baloo Thambi 2';font-weight:700;font-size:28px;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat .ic{width:38px;height:38px;border-radius:12px;background:var(--leaf);display:flex;align-items:center;justify-content:center}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.kc{background:#F6F1E4;border-radius:16px;padding:10px;min-height:200px}
.kc h3{font-size:16px;padding:4px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.kc h3 .n{background:#fff;border-radius:11px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px}
.kc.new{background:#FFF4D6}.kc.new h3 .n{background:var(--turmeric)}
.oc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.oc.urgent{border-color:var(--red);box-shadow:0 0 0 3px rgba(194,53,43,.12)}
.oc .it{font-size:14px;margin:6px 0}
.oc .it div{display:flex;gap:6px;align-items:flex-start;margin:2px 0}
.bar{height:6px;border-radius:3px;background:#F1ECDF;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:var(--green);transition:width 1s linear}
.bar.warn i{background:var(--red)}
.note{background:var(--amber-bg);color:#6B4B00;border-radius:8px;padding:5px 9px;font-size:12.5px;margin:6px 0}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#FBF7EF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(28,36,32,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px}
.mdl.lg{max-width:620px}
.mdl h2{font-size:23px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 20px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:absolute;right:0;top:50px;width:340px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(28,36,32,.2);z-index:60;padding:6px}
.pop .ni{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:14px}.pop .ni:hover{background:#FBF7EF}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.closed{background:var(--red-bg);color:#5B1D18}.banner.info{background:var(--leaf);color:#14502F}.banner.warn{background:var(--amber-bg);color:#6B4B00}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.menu-lay{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.cats .c{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;border-radius:10px;padding:0 12px;min-height:42px;align-items:center;font-weight:600;text-align:left}
.cats .c.on{background:var(--leaf);color:var(--green)}
.plan{border:2px solid var(--line);border-radius:18px;padding:20px;background:#fff;position:relative}
.plan.cur{border-color:var(--green);background:#F5FAF6}
.plan .pr{font-family:'Baloo Thambi 2';font-weight:700;font-size:34px}
.plan ul{padding-left:0;list-style:none;margin:12px 0;font-size:14px}.plan li{display:flex;gap:8px;margin:7px 0}
.rbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.rbar i{display:block;height:8px;border-radius:4px;background:var(--turmeric)}
.rbar .t{flex:1;background:#F1ECDF;height:8px;border-radius:4px;overflow:hidden}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:56px;height:62px;border-radius:12px;border:1.5px solid var(--line);text-align:center;font-size:26px;font-weight:700;outline:0}
.otp input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,107,69,.15)}
.otp.bad input{border-color:var(--red)}
.err{color:var(--red);font-size:13px;margin-top:6px}
.demo{border:1.5px dashed #BDB59E;background:#FFFDF6;border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:var(--green);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .r{display:flex;align-items:center;justify-content:center;padding:32px}
.login .box{width:100%;max-width:380px}
.ft{display:flex;align-items:center;gap:10px;font-size:15px}
.ft i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.faq{border-bottom:1px solid var(--line)}.faq button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;text-align:left;min-height:52px;font-weight:600;font-size:15px;gap:10px}
.faq p{margin:0 0 14px;color:var(--muted)}
@media(max-width:1180px){.kan{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .side.open{transform:none}
 .ib.ham{display:inline-flex}
 .top{padding:10px 14px}.content{padding:16px 14px 60px}
 .menu-lay,.grid2{grid-template-columns:1fr}
 .login{grid-template-columns:1fr}.login .l{padding:28px}
 .cats{display:flex;overflow:auto;gap:6px}.cats .c{width:auto;white-space:nowrap;flex:none}
}
@media(max-width:620px){.kan,.stats{grid-template-columns:1fr}.ph h1{font-size:24px}.hide-s{display:none}}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}.stat .v{font-size:23px}}
.scrim{position:fixed;inset:0;background:rgba(28,36,32,.45);z-index:35}
.bh{font-family:'Baloo Thambi 2';font-weight:700}.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.btn.g{background:transparent;color:var(--green);border:0;text-decoration:underline}
.al{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--amber-bg);color:#6B4B00;border:0;border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:48px;font-size:14px}
tr.late td{background:#FFF5F3}tr.clk{cursor:pointer}tr.clk:hover td{background:#FBF7EF}
.stat.row{align-items:flex-start}.main{min-width:0}.content{min-width:0}
select.fld{appearance:auto}
.mdl .btn.o.full{width:100%}
</style>

/* ---------- shell and render ---------- */
function shell(inner) {

  const notifyCard = S.showNotifications ? `<div class="card" style="position:absolute;right:0;top:calc(100% + 10px);width:330px;max-height:420px;overflow:auto;z-index:20;padding:10px 12px;box-shadow:0 18px 40px rgba(17,24,20,.14)"><div class="row sb" style="margin-bottom:10px"><b class="bh" style="font-size:15px">Notifications</b><button class="btn s o" data-act="markNotificationsRead">Mark all read</button></div>${S.notifications.length ? S.notifications.map((n) => `<div class="card" data-act="readNotification" data-arg="${n.id}" style="margin-bottom:8px;padding:10px;border-left:${n.unread ? '3px solid #F2B21B' : '3px solid #E3F2E8'};background:${n.unread ? '#FFF8ED' : '#F7F9F8'};cursor:pointer"><div class="row sb" style="gap:8px"><b class="sm">${esc(n.title)}</b>${n.unread ? '<span class="tag" style="background:#F2B21B;color:#fff;padding:2px 6px">New</span>' : ''}</div><div class="sm muted" style="margin-top:4px">${esc(n.description)}</div><div class="xs muted" style="margin-top:6px">${esc(n.related)} · ${fmtDateTime(n.timestamp)}</div></div>`).join('') : '<div class="empty">No notifications</div>'}</div>` : '';
  return `<div class="app"><aside class="side ${S.nav ? 'open' : ''}"><div class="logo">${logo(30)}<b>Inn<span>Town</span></b></div><div class="xs" style="color:rgba(255,255,255,.7);padding:0 8px 8px">Control dashboard</div>${nav.map((n) => `<button class="nv ${S.page === n[0] ? 'on' : ''}" data-act="go" data-arg="${n[0]}">${ic(n[2], 20)}${n[1]}${n[0] === 'tickets' && a.tix ? `<span class="bd">${a.tix}</span>` : ''}${n[0] === 'hotels' && a.pendH ? `<span class="bd">${a.pendH}</span>` : ''}${n[0] === 'riders' && a.pendR ? `<span class="bd">${a.pendR}</span>` : ''}</button>`).join('')}<div class="foot">v0.1 prototype · Sample data<br>Thuraiyur</div></aside>${S.nav ? '<div class="scrim" data-act="nav"></div>' : ''}
  <div class="main"><header class="top"><button class="ib ham" data-act="nav" aria-label="Menu">${ic('burger')}</button><div class="grow"><div class="hn">${NAV.find((n) => n[0] === S.page)[1]}</div><div class="xs muted">Signed in as ${esc(demoSession.name)} · ${R.n} · Demo</div></div>
  <div style="position:relative;display:flex;align-items:center;gap:10px;margin-right:8px">
    <button class="btn o" data-act="toggleNotifications" title="Notifications" style="position:relative;padding:9px 10px">${ic('bell', 18)}${unread ? `<span class="bd" style="right:-4px;top:-2px">${unread}</span>` : ''}</button>
    <button class="btn o" data-act="settingsShortcut" title="Settings" style="padding:9px 10px">${ic('gear', 18)}</button>
    ${notifyCard}
  </div>
  <button class="btn o" data-act="logout">Log out</button></header>
  <main class="content" id="content">${R.pages.includes(S.page) || S.page === 'settings' ? inner : noAccess()}</main></div></div>`;

function render() { if (!demoSession) { $('#root').innerHTML = loginPage(); return; } const ae = document.activeElement; const fid = ae && ae.id && !ae.closest('.mdl') ? ae.id : null; const pos = fid && ae.selectionStart != null ? ae.selectionStart : null; const sy = window.scrollY; $('#root').innerHTML = shell(ROLES[S.role].pages.includes(S.page) || S.page === 'settings' ? PAGES[S.page]() : noAccess()) + modal(); if (fid) { const e = document.getElementById(fid); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } } window.scrollTo(0, sy); }

/* ---------- actions ---------- */
const close = () => { S.modal = null; render(); };
const setH = (id, st, msg, bill) => { const h = hotel(+id); const old = h.status; h.status = st; if (bill) h.bill = bill; audit(`${msg} hotel "${h.name}"`, 'Hotels', 'Hotel', h.id, old, st); S.modal = null; render(); toast(`${h.name}: ${st}`); };
const setR = (id, st, msg) => { const r = rider(+id); const old = r.status; r.status = st; audit(`${msg} rider "${r.name}"`, 'Riders', 'Rider', r.id, old, st); S.modal = null; render(); toast(`${r.name}: ${st}`); };
const ACT = {
  go: (p) => { if (!ROLES[S.role].pages.includes(p)) { S.page = ROLES[S.role].pages[0]; S.modal = null; render(); toast('You are not authorized to open that page.'); return; } S.page = p; S.nav = false; S.showNotifications = false; render(); window.scrollTo(0, 0); }, settingsShortcut: () => { S.page = 'settings'; S.nav = false; S.showNotifications = false; S.modal = null; render(); window.scrollTo(0, 0); }, nav: () => { S.nav = !S.nav; render(); }, close, closeBg: (a, el) => { if (event.target === el) close(); },
  toggleNotifications: () => { S.showNotifications = !S.showNotifications; render(); },
  markNotificationsRead: () => { S.notifications.forEach((n) => { n.unread = false; }); render(); },
  readNotification: (id) => { const item = S.notifications.find((n) => n.id === id); if (item) item.unread = false; render(); },

  approveHotel: (id) => { if (needs('approve', 'approve hotels')) setH(id, 'Active', 'approved', 'Free trial'); }, rejectHotel: (id) => { if (needs('approve', 'reject hotels')) { const h = hotel(+id); audit(`rejected hotel "${h.name}"`, 'Hotels', 'Hotel', h.id, h.status, 'Rejected'); S.hotels = S.hotels.filter((x) => x !== h); S.modal = null; render(); toast('Hotel rejected'); } },
  pauseHotel: (id) => { if (needs('pause', 'pause listings')) setH(id, 'Paused', 'paused listing of'); }, resumeHotel: (id) => { if (needs('pause', 'reactivate listings')) setH(id, 'Active', 'reactivated'); }, blockHotel: (id) => { if (needs('block', 'block hotels')) setH(id, 'Blocked', 'blocked'); },
  approveRider: (id) => { if (needs('approve', 'approve riders')) setR(id, 'Offline', 'approved'); }, rejectRider: (id) => { if (needs('approve', 'reject riders')) { const r = rider(+id); audit(`rejected rider "${r.name}"`, 'Riders', 'Rider', r.id, r.status, 'Rejected'); S.riders = S.riders.filter((x) => x !== r); S.modal = null; render(); toast('Rider rejected'); } },
  pauseRider: (id) => { if (needs('pause', 'pause riders')) setR(id, 'Paused', 'paused'); }, resumeRider: (id) => { if (needs('pause', 'reactivate riders')) setR(id, 'Offline', 'reactivated'); },
  codToggle: (id) => { if (!needs('cod', 'change cash limits')) return; const c = cust(+id); const old = c.cod; c.cod = !c.cod; audit(`${c.cod ? 'allowed' : 'blocked'} cash on delivery for ${c.name}`, 'Customers', 'Customer', c.id, old ? 'COD allowed' : 'COD blocked', c.cod ? 'COD allowed' : 'COD blocked'); render(); toast(`Cash on delivery ${c.cod ? 'allowed' : 'blocked'} for ${c.name}`); },
  selectReassign: (a) => { const [orderId, riderId] = a.split(':').map(Number); if (!S.orders.some((o) => o.id === orderId) || !S.riders.some((r) => r.id === riderId && (r.status === 'Online' || r.status === 'Offline'))) return; S.modal = { k: 'reassign', arg: `${orderId}:${riderId}` }; render(); },
  contactRider: (a) => { if (!needs('reassign', 'contact riders')) return; const [mode, orderId, riderId] = a.split(':'); const r = rider(+riderId); if (!r) return; const order = S.orders.find((o) => o.id === +orderId); if (!order) return; const rawPhone = String(r.phone || ''); const digits = rawPhone.replace(/\D/g, ''); if (/[Xx]/.test(rawPhone) || digits.length < 8 || digits.length > 15) return toast('A complete registered mobile number is not available for this rider.'); const phone = digits.length === 10 ? `+91${digits}` : digits.length === 11 && digits[0] === '0' ? `+91${digits.slice(1)}` : `+${digits}`; const msg = `Hi ${r.name}, you have been assigned Order #${order.id}. We noticed that you haven't accepted the order yet. Could you please confirm the reason for the delay?`;

    if (mode === 'sms') { window.location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`; }
    audit(`contacted rider ${r.name} via ${mode} for order reassignment follow-up`, 'Live operations', 'Rider', r.id, '', mode.toUpperCase());
    toast(`Opened ${mode.toUpperCase()} for ${r.name}`); },
  doReassign: (a) => { if (!needs('reassign', 'reassign riders')) return; const [oid, rid] = a.split(':').map(Number); if (S.modal?.k !== 'reassign' || S.modal.arg !== `${oid}:${rid}`) return; const o = S.orders.find((x) => x.id === oid); const newRider = rider(rid); if (!o || !newRider || o.rider === rid || !['Online', 'Offline'].includes(newRider.status)) return; const oldRider = o.rider ? rider(o.rider).name : 'Unassigned'; const oldStatus = o.status; o.rider = rid; o.assignedAt = Date.now(); if (o.status === 'Placed' || o.status === 'Accepted' || o.status === 'Preparing') o.status = 'Rider assigned'; audit(`reassigned order #${oid} from ${oldRider} to ${newRider.name}`, 'Orders', 'Order', oid, { rider: oldRider, status: oldStatus }, { rider: newRider.name, status: o.status }); addNotification('Rider reassigned', `Order #${oid} was reassigned from ${oldRider} to ${newRider.name}.`, `Order #${oid}`, 'assignment', true); S.modal = null; render(); toast(`Order #${oid} now with ${newRider.name}`); },
  doRefund: (id) => { if (!needs('refund', 'give refunds')) return; const o = S.orders.find((x) => x.id === +id); const amt = +$('#rAmt').value; if (!(amt > 0) || amt > o.amt + o.fee) return toast('Enter a valid refund amount'); if (S.role === 'support' && amt > 500) return toast('Support can refund up to ₹500. Ask the Ops Manager.'); const old = o.status; o.status = 'Refunded'; audit(`refunded ${inr(amt)} on order #${o.id} (${$('#rWhy').value})`, 'Orders', 'Order', o.id, old, o.status); S.modal = null; render(); toast(`Refunded ${inr(amt)}`); },
  customerCancel: (id) => { const o = S.orders.find((x) => x.id === +id); if (!o || !o.packed || o.status === 'Cancelled' || o.status === 'Refunded') return toast('This order is not eligible for a post-packing cancellation'); const c = cust(o.cust); const oldCount = c.postPackingCancels || 0; const newCount = oldCount + 1; c.postPackingCancels = newCount; c.status = newCount >= 4 ? 'Blocked' : 'Active'; if (newCount >= 4) { c.blockedAt = Date.now(); c.blockReason = 'Automatically blocked after the fourth qualifying post-packing cancellation.'; }
    audit(`recorded post-packing cancellation for customer ${c.name} on order #${o.id} (count ${newCount})`, 'Customers', 'Customer', c.id, { count: oldCount, status: c.status }, { count: newCount, status: c.status });
    addNotification('Customer block warning', `${c.name} has ${newCount} qualifying post-packing cancellations.`, `Customer #${c.id}`, 'account', true);
    if (newCount >= 4) { addNotification('Customer account blocked', `${c.name} was blocked from placing further orders after the 4th qualifying post-packing cancellation.`, `Customer #${c.id}`, 'account', true); }
    o.status = 'Cancelled'; S.modal = null; render(); toast(newCount >= 4 ? `${c.name} was blocked after the 4th qualifying post-packing cancellation.` : `Warning ${newCount}: ${c.name} has a post-packing cancellation on record.`); },
  remind: (id) => { if (!needs('remind', 'send reminders')) return; const h = hotel(+id); audit(`sent billing reminder to "${h.name}"`); toast(`WhatsApp reminder sent to ${h.name}`); },
  markPaid: (id) => { if (!needs('markpaid', 'mark plans as paid')) return; const h = hotel(+id); const old = { billing: h.bill, status: h.status }; h.bill = 'Paid'; h.due = Date.now() + 30 * DAY; if (h.status === 'Paused') h.status = 'Active'; audit(`marked "${h.name}" plan as paid`, 'Subscriptions', 'Hotel', h.id, old, { billing: h.bill, status: h.status }); render(); toast(`${h.name}: paid`); },
  pauseListing: (id) => { if (needs('pause', 'pause listings')) { const h = hotel(+id); const old = h.status; h.status = 'Paused'; audit(`paused listing "${h.name}" (unpaid)`, 'Hotels', 'Hotel', h.id, old, h.status); render(); toast(`${h.name} listing paused`); } },
  runPayout: () => { if (!needs('payout', 'run payouts')) return; const due = S.riders.filter((r) => r.status !== 'Pending' && !r.paid); due.forEach((r) => { r.paid = true; }); audit(`marked weekly payouts as paid for ${due.length} riders`, 'Payouts', 'Rider payout', 'Weekly batch', due.map((r) => ({ rider: r.name, paid: false })), due.map((r) => ({ rider: r.name, paid: true }))); render(); toast('All rider payouts marked as paid'); },
  deposit: (id) => { if (!needs('payout', 'record cash deposits')) return; const r = rider(+id); const old = r.cash; r.cash = 0; audit(`received cash deposit from ${r.name}`, 'Payouts', 'Rider', r.id, old, r.cash); render(); toast(`${r.name}: cash deposit recorded`); },
  tReply: (id) => { if (!needs('ticket', 'reply to complaints')) return; const v = ($('#tRep') || {}).value; if (!v || !v.trim()) return toast('Write a reply first'); const t = S.tickets.find((x) => x.id === +id); const old = t.status; t.replies.push([ROLES[S.role].n, v.trim()]); if (t.status === 'Open') t.status = 'In progress'; addNotification('Complaint update', `Complaint #${t.id} received a response from ${ROLES[S.role].n}.`, `Complaint #${t.id}`, 'complaint', true); audit(`replied to complaint #${t.id}`, 'Complaints', 'Ticket', t.id, old, t.status); render(); toast('Reply sent'); },
  tResolve: (id) => { if (!needs('ticket', 'resolve complaints')) return; const t = S.tickets.find((x) => x.id === +id); const old = t.status; t.status = 'Resolved'; addNotification('Complaint resolved', `Complaint #${t.id} was resolved by ${ROLES[S.role].n}.`, `Complaint #${t.id}`, 'complaint', true); audit(`resolved complaint #${t.id}`, 'Complaints', 'Ticket', t.id, old, t.status); S.modal = null; render(); toast('Complaint resolved'); },
  tRefund: (id) => { if (!needs('refund', 'issue refunds')) return; const t = S.tickets.find((x) => x.id === +id); if (S.role === 'support' && t.amt > 500) return toast('Support can refund up to ₹500.'); const o = S.orders.find((x) => x.id === t.order); const old = { ticketStatus: t.status, orderStatus: o ? o.status : 'Not found' }; if (o) o.status = 'Refunded'; t.status = 'Resolved'; audit(`refunded ${inr(t.amt)} for complaint #${t.id}`, 'Complaints', 'Ticket', t.id, old, { ticketStatus: t.status, orderStatus: o ? o.status : 'Not found' }); S.modal = null; render(); toast(`Refunded ${inr(t.amt)}`); },
  saveCfg: () => { if (!needs('settings', 'change settings')) return; const changed = Object.keys(S.cfg).filter((k) => S.cfg[k] !== cfgSaved[k]); if (changed.length) { const oldValues = Object.fromEntries(changed.map((k) => [k, cfgSaved[k]])); const newValues = Object.fromEntries(changed.map((k) => [k, S.cfg[k]])); audit(`updated application settings: ${changed.map((k) => `${k} ${cfgSaved[k]} → ${S.cfg[k]}`).join(', ')}`, 'Settings', 'Configuration', 'Fees and rules', oldValues, newValues); changed.forEach((k) => { cfgSaved[k] = S.cfg[k]; }); } else { audit('saved application settings with no changes', 'Settings', 'Configuration', 'Fees and rules'); } toast('Settings saved'); render(); },
  addMember: () => { if (!needs('team', 'manage team members')) return; const n = $('#mName').value.trim(); if (!n) return toast('Type a name'); const r = $('#mRole').value; S.team.push([n, ROLES[r].n, r, 'Never']); audit(`added team member "${n}" as ${ROLES[r].n}`, 'Team', 'Admin', n, '', { role: ROLES[r].n, status: 'Pending' }); S.modal = null; render(); toast('Team member added'); },
  csv: (a) => { if (a === 'activity' && !needs('audit', 'export activity logs')) return; if (!needs('export', 'download files')) return; if (a === 'orders') saveCsv('inntown-orders.csv', ['Order,Hotel,Customer,Payment,Status,Amount'].concat(filtOrders().map((o) => [o.id, '"' + hotel(o.hotel).name + '"', cust(o.cust).name, o.pay, o.status, o.amt].join(',')))); else if (a === 'payouts') saveCsv('inntown-payouts.csv', ['Rider,Delivery fees,Status'].concat(S.riders.map((r) => [r.name, r.week, r.paid ? 'Paid' : 'Due'].join(',')))); else if (a === 'activity') saveCsv('inntown-activity.csv', ['When (UTC),Admin,Role,Action,Module,Entity type,Entity ID,Old value,New value'].concat(S.log.map((l) => [l.created_at, l.who, l.role, '"' + l.action.replace(/"/g, '""') + '"', l.module, l.entityType, l.entityId, '"' + l.oldValue.replace(/"/g, '""') + '"', '"' + l.newValue.replace(/"/g, '""') + '"'].join(',')))); else saveCsv('inntown-report.csv', ['Metric,Value', 'Orders per day,86', 'Repeat customers,38%', 'Avg delivery time,31 min']); audit(`downloaded ${a} CSV`, a === 'activity' ? 'Activity log' : 'Reports', 'Export', a); toast('File downloaded'); }
};
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-stop]') && !t.closest('button') && !t.closest('a')) return;
  const mo = t.closest('[data-modal]'); const ea = t.closest('[data-act]'); if (mo && !(ea && mo.contains(ea))) { S.modal = { k: mo.dataset.modal, arg: mo.dataset.arg }; render(); return; }
  const el = t.closest('[data-act]'); if (!el) return; window.event = e; const f = ACT[el.dataset.act]; if (f) f(el.dataset.arg, el);
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const username = $('#loginUser').value.trim();
  const password = $('#loginPassword').value;
  if (!username || !password) { $('#loginError').textContent = 'Enter a username and password to continue the demo.'; $('#loginError').hidden = false; return; }
  const role = $('#demoRole').value;
  const submit = $('#loginSubmit');
  submit.disabled = true;
  submit.textContent = 'Starting demo…';
  setTimeout(() => {
    S.role = role;
    S.page = ROLES[role].pages[0];
    S.logRole = 'All'; S.logModule = 'All'; S.logSearch = ''; S.logAction = ''; S.logFrom = ''; S.logTo = ''; S.logPage = 0;
    demoSession = { id: `demo-${role}`, name: ROLES[role].who, role };
    audit('successful demo sign-in', 'Authentication', 'Admin', demoSession.id);
    render();
  }, 250);
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k) return;
  const v = e.target.value;
  if (k.startsWith('cfg:')) { S.cfg[k.slice(4)] = +v; return; }
  const stateKey = { hq: 'hq', rq: 'rq', cq: 'cq', oq: 'oq', logSearch: 'logSearch', logRole: 'logRole', logModule: 'logModule', logAction: 'logAction', logFrom: 'logFrom', logTo: 'logTo' }[k];
  if (stateKey) { S[stateKey] = v; if (k.startsWith('log')) S.logPage = 0; render(); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k === 'logRole' || k === 'logModule' || k === 'logFrom' || k === 'logTo') { S[k] = e.target.value; S.logPage = 0; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) close(); });
render();
window.__app = { S, ACT, render, ROLES };
})();
</script></body></html>
